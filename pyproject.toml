[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-lite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["transformers", "accelerate"]  # torch installed separately from the CUDA index

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["vllm_lite"]